<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кейс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="brand-dot"></span>
      <span class="brand-text"><span data-site="name"></span><span class="brand-tagline" data-site="tagline"></span></span>
    </a>
    <div class="header-actions">
      <a class="icon-link" data-link="instagram" target="_blank" rel="noopener" aria-label="Instagram">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="2" y="2" width="20" height="20" rx="6" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/></svg>
      </a>
      <button class="pill-btn" data-theme-toggle aria-label="Сменить тему">Светлая</button>
      <a class="btn btn-primary header-cta" data-link="telegram" target="_blank" rel="noopener">Telegram</a>
    </div>
  </div>
</header>

<main class="case-hero">
  <div class="container">
    <a class="back-link" href="index.html#cases">← Все кейсы</a>
    <span class="eyebrow" id="caseEyebrow"></span>
    <h1 class="case-hero-title" id="caseTitle"></h1>
    <p class="case-hero-niche" id="caseNiche"></p>
    <div class="case-hero-meta" id="caseMeta"></div>

    <div class="case-big" id="caseBig"></div>
    <div class="metric-panel" id="metricPanel"></div>

    <div class="case-body">
      <div class="case-block"><span class="label">Задача</span><p id="caseTask"></p></div>
      <div class="case-block"><span class="label">Что сделал</span><ul id="caseDone"></ul></div>
      <div class="case-block"><span class="label">Результат</span><ul id="caseResults"></ul></div>
      <div class="case-block" id="baBlock"><span class="label">Было → стало</span><div id="caseBA"></div></div>
    </div>
    <div class="case-note" id="caseInsight"><span class="label">Вывод</span><p></p></div>

    <nav class="case-nav">
      <a id="prevCase" href="#"></a>
      <a id="nextCase" href="#"></a>
    </nav>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span class="eyebrow">Связь</span>
    <h2>Нашли похожую нишу? Обсудим ваш проект</h2>
    <p class="footer-sub">Напишите — договоримся о видеовстрече. Стратегию продвижения сделаю бесплатно, до предоплаты.</p>
    <div class="footer-ctas">
      <a class="btn btn-primary" data-link="telegram" target="_blank" rel="noopener">Написать в Telegram</a>
      <a class="btn btn-ghost" data-link="email">Email</a>
      <a class="btn btn-ghost" data-link="instagram" target="_blank" rel="noopener">Instagram</a>
    </div>
  </div>
  <div class="container footer-bottom"><span data-site="name"></span><span>© <span data-year></span></span></div>
</footer>

<script src="js/cases.js"></script>
<script src="js/common.js"></script>
<script src="js/case.js"></script>
</body>
</html>
